[package]
name = "roblox-toolchain"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Offline Roblox asset conversion and native game assembly"
repository = "https://github.com/TamedTornado/RobloxToolchain"
autobins = false

[[bin]]
name = "roblox"
path = "src/cli.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
gltf = { version = "1.4", default-features = false, features = ["utils", "names"] }
glam = "=0.33.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "multipart", "gzip", "native-tls"] }

tempfile = "3"
ufbx = "=0.11.4"
base64 = "0.22"
percent-encoding = "2"
parry3d = { version = "=0.31.1", features = ["enhanced-determinism"] }
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg", "bmp", "tga"] }
ffmpeg-next = { version = "=8.0.0", default-features = false, features = ["codec", "format", "software-scaling"] }
rbx_binary = "=3.0.0"
rbx_dom_weak = "=4.2.0"
rbx_reflection = "=7.0.0"
rbx_reflection_database = { version = "=3.0.0", features = ["debug_always_use_bundled"] }
mlua = { version = "=0.11.4", features = ["luau", "vendored", "error-send"] }
symphonia = { version = "=0.5.5", default-features = false, features = ["wav", "pcm", "ogg", "vorbis", "flac", "mp3"] }
vorbis_rs = { version = "=0.5.6", default-features = false }

[dev-dependencies]
rbx_mesh = { version = "=0.7.0", default-features = false, features = ["mesh", "union-physics"] }
